<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nomad Site</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: Georgia, "Times New Roman", serif;
        background: #f4efe6;
        color: #1f1a14;
      }

      main {
        max-width: 36rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3.25rem);
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        font-size: 1.125rem;
        line-height: 1.6;
        color: #4a433a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Nomad Site</h1>
      <p>Um ponto de partida simples. Em breve, mais conteúdo por aqui.</p>
    </main>
  </body>
</html>
